"$schema" = "https://starship.rs/config-schema.json"

# ─────────────────────────────────────────────
# TWIN — Premium Minimal / Rust
# ─────────────────────────────────────────────

add_newline = true
palette = "twin"

format = """
[TWIN](bold cyan)\
$directory\
$git_branch\
$git_status\
$rust\
$status\
$fill\
$cmd_duration\
$time
$character"""

# ─────────────────────────────────────────────
# Palette
# ─────────────────────────────────────────────

[palettes.twin]
cyan = "#5DE4FF"
ice = "#E6EDF7"
violet = "#A78BFA"
green = "#5EE6A8"
amber = "#FFC76B"
red = "#FF6B81"
muted = "#7A8494"

# ─────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────

[directory]
style = "bold ice"
format = "[ · ](muted)[$path]($style)"
truncation_length = 3
truncate_to_repo = false

# ─────────────────────────────────────────────
# Git Branch
# ─────────────────────────────────────────────

[git_branch]
symbol = ""
style = "bold violet"
format = "[ · ](muted)[$branch]($style)"

# ─────────────────────────────────────────────
# Git Status
# ─────────────────────────────────────────────

[git_status]
style = "amber"
format = "[$all_status$ahead_behind]($style)"

conflicted = " !${count}"
ahead = " ↑${count}"
behind = " ↓${count}"
diverged = " ↑${ahead_count}↓${behind_count}"
up_to_date = ""

untracked = " ?${count}"
stashed = ""
modified = " ~${count}"
staged = " +${count}"
renamed = " >${count}"
deleted = " -${count}"

# ─────────────────────────────────────────────
# Rust
# ─────────────────────────────────────────────

[rust]
symbol = "rs "
style = "green"
version_format = "${major}.${minor}"
format = "[ · ](muted)[$symbol$version]($style)"

# ─────────────────────────────────────────────
# Previous command failure
# ─────────────────────────────────────────────

[status]
disabled = false
symbol = ""
format = "[ · ](muted)[exit $status](bold red)"

# ─────────────────────────────────────────────
# Push right-side modules to the edge
# ─────────────────────────────────────────────

[fill]
symbol = " "
style = "none"

# ─────────────────────────────────────────────
# Command duration
# Only appears for commands >= 1.5 seconds
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 1500
show_milliseconds = false
style = "dimmed amber"
format = "[$duration]($style)[ · ](muted)"

# ─────────────────────────────────────────────
# Clock
# ─────────────────────────────────────────────

[time]
disabled = false
time_format = "%I:%M %p"
style = "dimmed muted"
format = "[$time]($style)"

# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
